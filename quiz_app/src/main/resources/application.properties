# ============================================
# APPLICATION
# ============================================
spring.application.name=quiz_app
server.port=${PORT:9091}

# ============================================
# MYSQL DATABASE (RAILWAY)
# ============================================
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE:${MYSQL_DATABASE:quiz_app}}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# ============================================
# JPA
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:false}

# ============================================
# LOGGING
# ============================================
logging.level.org.hibernate.SQL=${LOGGING_LEVEL_ORG_HIBERNATE_SQL:WARN}
logging.level.org.springframework.security=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_SECURITY:WARN}

# ============================================
# JWT
# ============================================
jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

# ============================================
# GEMINI AI
# ============================================
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest:generateContent

# ============================================
# EMAIL
# ============================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Railway Trial/Hobby blocks SMTP, so Resend is the production default.
# Use EMAIL_PROVIDER=smtp only for local tests or Railway Pro.
email.provider=${EMAIL_PROVIDER:resend}
email.from=${EMAIL_FROM:${MAIL_USERNAME:}}
resend.api.key=${RESEND_API_KEY:}
resend.api.url=${RESEND_API_URL:https://api.resend.com/emails}

# ============================================
# FRONTEND URL
# ============================================
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ============================================
# MAIL LOGS
# ============================================
logging.level.org.springframework.mail=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_MAIL:WARN}
logging.level.com.sun.mail=${LOGGING_LEVEL_COM_SUN_MAIL:WARN}
spring.mail.properties.mail.debug=${SPRING_MAIL_PROPERTIES_MAIL_DEBUG:false}
