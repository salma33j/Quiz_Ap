<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Brain -->
  <g id="brain">
    <path d="M 30 50 Q 25 35 35 30 Q 40 28 42 35 Q 45 25 50 23 Q 55 25 58 35 Q 60 28 65 30 Q 75 35 70 50 Q 72 60 65 65 Q 58 68 50 68 Q 42 68 35 65 Q 28 60 30 50 Z" fill="#0052CC" opacity="0.3"/>
    <circle cx="45" cy="45" r="6" fill="#0052CC"/>
    <circle cx="55" cy="45" r="6" fill="#0052CC"/>
  </g>
  
  <!-- Checklist Document -->
  <g id="document">
    <rect x="58" y="30" width="28" height="35" rx="3" fill="#C7E6F7" stroke="#0052CC" stroke-width="1.5"/>
    <line x1="62" y1="36" x2="82" y2="36" stroke="#0052CC" stroke-width="1.5"/>
    <line x1="62" y1="42" x2="82" y2="42" stroke="#0052CC" stroke-width="1.5"/>
    <line x1="62" y1="48" x2="82" y2="48" stroke="#0052CC" stroke-width="1.5"/>
    <line x1="62" y1="54" x2="82" y2="54" stroke="#0052CC" stroke-width="1.5"/>
    
    <!-- Checkmarks -->
    <g id="check1">
      <rect x="59" y="34" width="2" height="2" fill="#0052CC"/>
      <line x1="58" y1="37" x2="61" y2="40" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="61" y1="40" x2="65" y2="35" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g id="check2">
      <rect x="59" y="40" width="2" height="2" fill="#0052CC"/>
      <line x1="58" y1="43" x2="61" y2="46" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="61" y1="46" x2="65" y2="41" stroke="#0052CC" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    
    <!-- Empty checkbox -->
    <rect x="58" y="51" width="4" height="4" rx="0.5" fill="none" stroke="#0052CC" stroke-width="1"/>
  </g>
  
  <!-- Light bulb in brain -->
  <circle cx="50" cy="45" r="5" fill="#87CEEB" opacity="0.8"/>
  <path d="M 48 42 L 52 42 L 52 46 L 48 46 Z" fill="#FFD700"/>
  
  <!-- Sparkles -->
  <g id="sparkles">
    <path d="M 75 22 L 76 24 L 78 25 L 76 26 L 75 28 L 74 26 L 72 25 L 74 24 Z" fill="#0052CC"/>
    <path d="M 20 70 L 21 71 L 22 72 L 21 73 L 20 74 L 19 73 L 18 72 L 19 71 Z" fill="#0052CC"/>
  </g>
</svg>